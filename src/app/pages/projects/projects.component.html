<section id="projects" class="py-24 lg:py-32 bg-white relative overflow-hidden">
  <div
    class="absolute top-0 right-0 w-[800px] h-[800px] bg-gradient-to-br from-blue-50/50 to-transparent rounded-full blur-[100px] -translate-y-1/4 translate-x-1/4 pointer-events-none"
  ></div>
  <div
    class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-gradient-to-tr from-[#00D9FF]/5 to-transparent rounded-full blur-[80px] translate-y-1/4 -translate-x-1/4 pointer-events-none"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div
      class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-16 lg:mb-20"
      data-aos="fade-up"
    >
      <div class="max-w-2xl">
        <div
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-50 border border-gray-100 mb-6"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-[#00D9FF]"></span>
          <span class="text-xs font-bold text-gray-500 uppercase tracking-[0.15em]"
            >Case Studies</span
          >
        </div>

        <h2
          class="text-4xl md:text-5xl lg:text-[3.5rem] font-bold text-[#0B0F19] tracking-tight leading-[1.1] mb-6"
        >
          Featured
          <span
            class="font-serif italic text-transparent bg-clip-text bg-gradient-to-r from-[#2563EB] to-[#00D9FF] font-medium"
            >Work.</span
          >
        </h2>
        <p class="text-lg text-gray-500 leading-relaxed font-medium">
          A selection of scalable platforms, administrative dashboards, and enterprise applications
          we've engineered.
        </p>
      </div>

      <button
        class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-white border border-gray-200 text-sm font-semibold text-[#0B0F19] hover:border-blue-200 hover:text-[#2563EB] hover:bg-blue-50/50 hover:shadow-sm transition-all duration-300 group"
      >
        View All Projects
        <lucide-icon
          name="arrow-right"
          class="w-4 h-4 group-hover:translate-x-1 transition-transform"
        ></lucide-icon>
      </button>
    </div>

    <div class="grid md:grid-cols-2 gap-8 lg:gap-12">
      <div
        *ngFor="let project of projects; let i = index"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 100"
        class="group flex flex-col gap-6"
      >
        <div
          class="relative w-full aspect-[4/3] rounded-[2rem] bg-[#F8FAFC] border border-gray-100 overflow-hidden shadow-sm hover:shadow-[0_20px_40px_-15px_rgba(37,99,235,0.15)] hover:border-blue-100 transition-all duration-500 cursor-pointer"
        >
          <div class="h-12 border-b border-gray-100 bg-white/50 flex items-center px-5 gap-4">
            <div class="flex gap-2">
              <div class="w-3 h-3 rounded-full bg-[#ff5f57] border border-[#ff5f57]/20"></div>
              <div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#ffbd2e]/20"></div>
              <div class="w-3 h-3 rounded-full bg-[#28c840] border border-[#28c840]/20"></div>
            </div>
            <div class="flex-1 mx-2">
              <div
                class="h-6 bg-white border border-gray-100 rounded-md flex items-center px-3 shadow-sm"
              >
                <div
                  class="w-2 h-2 rounded-full mr-2"
                  [style.backgroundColor]="project.accent"
                ></div>
                <div class="h-1.5 w-24 bg-gray-200 rounded-sm"></div>
              </div>
            </div>
          </div>

          <div class="absolute inset-x-0 bottom-0 top-12 p-6 bg-[#F8FAFC]">
            <div
              class="w-full h-full rounded-xl bg-white border border-gray-100 shadow-sm p-5 flex flex-col gap-4 transform group-hover:scale-[1.02] transition-transform duration-700"
            >
              <div class="flex justify-between items-center pb-3 border-b border-gray-50">
                <div class="flex items-center gap-3">
                  <div
                    class="w-6 h-6 rounded-md flex items-center justify-center"
                    [style.backgroundColor]="project.accentLight"
                  >
                    <div
                      class="w-2.5 h-2.5 rounded-sm"
                      [style.backgroundColor]="project.accent"
                    ></div>
                  </div>
                  <div class="h-2.5 w-32 bg-gray-200 rounded-full"></div>
                </div>
                <div class="flex gap-2">
                  <div
                    class="h-6 px-3 rounded-md flex items-center"
                    [style.backgroundColor]="project.accentLight"
                  >
                    <div
                      class="h-1.5 w-10 rounded-sm"
                      [style.backgroundColor]="project.accent"
                    ></div>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div class="p-3 rounded-xl bg-[#F8FAFC] border border-gray-50">
                  <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">
                    {{ project.metricLabel1 }}
                  </div>
                  <div class="text-lg font-bold" [style.color]="project.accent">
                    {{ project.metric1 }}
                  </div>
                </div>
                <div class="p-3 rounded-xl bg-[#F8FAFC] border border-gray-50">
                  <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">
                    {{ project.metricLabel2 }}
                  </div>
                  <div class="text-lg font-bold text-[#0B0F19]">{{ project.metric2 }}</div>
                </div>
              </div>

              <div
                class="flex-1 rounded-xl bg-[#F8FAFC] border border-gray-50 p-4 flex flex-col justify-end"
              >
                <div class="flex items-end gap-1.5 w-full h-full">
                  <div
                    *ngFor="let h of project.chartHeights"
                    class="flex-1 rounded-t-md transition-all duration-500"
                    [style.height]="h"
                    [style.background]="
                      'linear-gradient(to top, ' + project.accent + ', ' + project.accent + '80)'
                    "
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <div
            class="absolute inset-0 bg-white/40 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center z-20"
          >
            <button
              class="w-14 h-14 rounded-full bg-[#0B0F19] text-white shadow-xl flex items-center justify-center opacity-0 group-hover:opacity-100 translate-y-4 group-hover:translate-y-0 transition-all duration-500 hover:scale-110 hover:bg-[#2563EB]"
            >
              <lucide-icon name="external-link" class="w-5 h-5 ml-0.5 mb-0.5"></lucide-icon>
            </button>
          </div>
        </div>

        <div class="flex flex-col gap-3 px-2">
          <div class="flex flex-wrap gap-2">
            <span
              *ngFor="let tag of project.tags"
              class="px-3 py-1 text-[10px] font-bold tracking-[0.15em] uppercase rounded-full bg-gray-50 border border-gray-100 text-gray-500"
            >
              {{ tag }}
            </span>
          </div>
          <h3
            class="text-2xl font-bold text-[#0B0F19] tracking-tight group-hover:text-[#2563EB] transition-colors duration-300"
          >
            {{ project.title }}
          </h3>
          <p class="text-gray-500 leading-relaxed text-sm">
            {{ project.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
