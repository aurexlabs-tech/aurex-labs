<section class="py-24 lg:py-32 bg-[#F8FAFC] relative overflow-hidden">
  <div
    class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-br from-[#2563EB]/5 to-[#00D9FF]/5 rounded-full blur-[100px] -translate-y-1/3 translate-x-1/4 pointer-events-none"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="text-center mb-16 lg:mb-24" data-aos="fade-up">
      <div
        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-blue-100 shadow-sm mb-6"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-[#2563EB]"></span>
        <span class="text-xs font-bold text-[#2563EB] uppercase tracking-[0.15em]"
          >Client Voices</span
        >
      </div>
      <h2
        class="text-4xl md:text-5xl lg:text-[3.5rem] font-bold text-[#0B0F19] tracking-tight leading-[1.1]"
      >
        Trusted by
        <span
          class="font-serif italic text-transparent bg-clip-text bg-gradient-to-r from-[#2563EB] to-[#00D9FF] font-medium"
          >visionaries.</span
        >
      </h2>
    </div>

    <div class="grid md:grid-cols-3 gap-6 lg:gap-8 items-start">
      <div
        *ngFor="let review of reviews; let i = index"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 150"
        class="group relative bg-white rounded-[2rem] p-8 lg:p-10 border border-gray-100 shadow-[0_10px_30px_-15px_rgba(0,0,0,0.04)] hover:shadow-[0_20px_40px_-15px_rgba(37,99,235,0.12)] hover:border-blue-100 transition-all duration-500"
        [ngClass]="{ 'lg:mt-12': i === 1 }"
      >
        <div
          class="flex gap-1 mb-8 text-[#0B0F19] group-hover:text-[#2563EB] transition-colors duration-500"
        >
          <svg
            *ngFor="let star of [1, 2, 3, 4, 5]"
            class="w-4 h-4 fill-current"
            viewBox="0 0 20 20"
          >
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
            />
          </svg>
        </div>

        <p
          class="text-[1.15rem] font-serif italic text-[#0B0F19] leading-relaxed mb-10 group-hover:text-[#2563EB] transition-colors duration-500"
        >
          "{{ review.quote }}"
        </p>

        <div
          class="flex items-center gap-4 pt-6 border-t border-gray-50 group-hover:border-blue-50 transition-colors duration-500"
        >
          <div
            class="w-12 h-12 rounded-full bg-[#0B0F19] text-white flex items-center justify-center font-bold text-sm shadow-md group-hover:bg-gradient-to-br group-hover:from-[#2563EB] group-hover:to-[#00D9FF] transition-all duration-500 group-hover:scale-110"
          >
            {{ review.initials }}
          </div>

          <div>
            <div class="font-bold text-[#0B0F19] tracking-tight">{{ review.name }}</div>
            <div class="text-[10px] text-gray-400 uppercase tracking-[0.15em] mt-0.5 font-bold">
              {{ review.role }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
