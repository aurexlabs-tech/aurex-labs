<section class="py-10 bg-white border-b border-gray-100 overflow-hidden flex flex-col items-center">
  <p class="text-[10px] font-bold tracking-[0.2em] text-gray-400 uppercase mb-8 text-center px-4">
    Engineered using enterprise-grade infrastructure
  </p>

  <div class="relative w-full max-w-[100vw] flex overflow-hidden group">
    <div
      class="absolute left-0 top-0 bottom-0 w-24 md:w-40 bg-gradient-to-r from-white to-transparent z-10 pointer-events-none"
    ></div>
    <div
      class="absolute right-0 top-0 bottom-0 w-24 md:w-40 bg-gradient-to-l from-white to-transparent z-10 pointer-events-none"
    ></div>

    <div class="flex w-max animate-marquee group-hover:[animation-play-state:paused]">
      <ng-container *ngFor="let loop of [1, 2]">
        <div class="flex items-center gap-12 md:gap-20 px-6 md:px-10">
          <div
            *ngFor="let tech of technologies"
            class="flex items-center gap-3 grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all duration-300 cursor-default"
          >
            <div
              class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-[#2563EB]"
            >
              <lucide-icon [img]="tech.icon" class="w-4 h-4"></lucide-icon>
            </div>
            <span class="text-sm font-bold text-[#0B0F19] tracking-tight">{{ tech.name }}</span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</section>
