<section class="relative py-24 lg:py-32 bg-white overflow-hidden">
  <div
    class="absolute top-0 left-0 w-[500px] h-[500px] bg-gradient-to-br from-blue-50/50 to-transparent rounded-full blur-[100px] -translate-y-1/2 -translate-x-1/4 pointer-events-none"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="mb-16 lg:mb-20 max-w-2xl" data-aos="fade-right">
      <div
        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-50 border border-gray-100 mb-6"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-[#2563EB]"></span>
        <span class="text-xs font-bold text-gray-500 uppercase tracking-[0.15em]"
          >Why AurexLabs</span
        >
      </div>

      <h2
        class="text-4xl md:text-5xl lg:text-[3.5rem] font-bold text-[#0B0F19] tracking-tight leading-[1.1] mb-6"
      >
        The AurexLabs
        <span
          class="font-serif italic text-transparent bg-clip-text bg-gradient-to-r from-[#2563EB] to-[#00D9FF] font-medium"
          >Advantage.</span
        >
      </h2>
      <p class="text-lg text-gray-500 leading-relaxed font-medium">
        We don't just write code — we engineer solutions that scale. Here is why ambitious
        businesses partner with us.
      </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        *ngFor="let benefit of benefits; let i = index"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 80"
        class="group relative p-8 rounded-[2rem] bg-[#F8FAFC] border border-gray-50 hover:bg-white hover:border-blue-100 hover:shadow-[0_20px_40px_-15px_rgba(37,99,235,0.1)] transition-all duration-500 hover:-translate-y-1 overflow-hidden"
      >
        <div
          class="absolute inset-0 bg-gradient-to-br from-blue-50/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
        ></div>

        <div class="relative z-10">
          <div
            class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center mb-6 group-hover:bg-gradient-to-br group-hover:from-[#2563EB] group-hover:to-[#00D9FF] group-hover:border-transparent group-hover:shadow-lg group-hover:shadow-blue-500/25 transition-all duration-500 group-hover:scale-110"
          >
            <lucide-icon
              [img]="benefit.icon"
              class="w-6 h-6 text-gray-400 group-hover:text-white transition-colors duration-500"
            ></lucide-icon>
          </div>

          <h3
            class="text-xl font-bold text-[#0B0F19] mb-3 tracking-tight group-hover:text-[#2563EB] transition-colors duration-300"
          >
            {{ benefit.title }}
          </h3>
          <p class="text-gray-500 text-sm lg:text-base leading-relaxed">
            {{ benefit.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
