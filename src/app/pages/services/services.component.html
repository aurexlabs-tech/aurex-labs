<section id="services" class="relative py-24 lg:py-32 bg-[#F8FAFC] overflow-hidden">
  <div
    class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-br from-[#2563EB]/5 to-[#00D9FF]/5 rounded-full blur-[100px] pointer-events-none"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="max-w-2xl mb-16 lg:mb-20" data-aos="fade-right">
      <div
        class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 border border-blue-100 mb-6"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-[#2563EB]"></span>
        <span class="text-xs font-bold text-[#2563EB] uppercase tracking-[0.15em]"
          >What We Build</span
        >
      </div>

      <h2
        class="text-4xl md:text-5xl lg:text-[3.5rem] font-bold text-[#0B0F19] tracking-tight leading-[1.1] mb-6"
      >
        Digital solutions that<br />
        <span
          class="font-serif italic text-transparent bg-clip-text bg-gradient-to-r from-[#2563EB] to-[#00D9FF] font-medium"
          >drive business growth.</span
        >
      </h2>
      <p class="text-lg text-gray-500 leading-relaxed font-medium">
        We partner with growing businesses and enterprises to build robust, scalable, and
        beautifully designed software systems.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 lg:gap-6">
      <div
        *ngFor="let service of services; let i = index"
        [attr.data-aos]="'fade-up'"
        [attr.data-aos-delay]="i * 100"
        class="group relative bg-white rounded-[2rem] border border-gray-100 p-8 lg:p-10 overflow-hidden hover:-translate-y-1 hover:border-blue-100 hover:shadow-[0_20px_40px_-15px_rgba(37,99,235,0.1)] transition-all duration-500 cursor-pointer"
        [ngClass]="service.spanClass"
      >
        <div
          class="absolute inset-0 bg-gradient-to-br from-blue-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
        ></div>

        <div class="relative z-10 flex flex-col h-full">
          <div class="flex justify-between items-start mb-10">
            <div
              class="w-14 h-14 rounded-2xl bg-[#F8FAFC] border border-gray-100 flex items-center justify-center text-gray-400 group-hover:bg-[#0B0F19] group-hover:text-white group-hover:border-[#0B0F19] group-hover:shadow-lg transition-all duration-500"
            >
              <lucide-icon [img]="service.icon" class="w-6 h-6"></lucide-icon>
            </div>

            <div
              class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-[#2563EB] opacity-0 -translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 group-hover:shadow-sm transition-all duration-500 delay-75"
            >
              <lucide-icon name="arrow-right" class="w-4 h-4"></lucide-icon>
            </div>
          </div>

          <div class="mt-auto">
            <h3
              class="text-2xl font-bold text-[#0B0F19] mb-3 tracking-tight group-hover:text-[#2563EB] transition-colors duration-300"
            >
              {{ service.title }}
            </h3>
            <p class="text-gray-500 leading-relaxed text-sm lg:text-base max-w-md">
              {{ service.description }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
