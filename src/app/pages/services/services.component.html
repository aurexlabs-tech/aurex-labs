<section id="services" class="services-section relative py-14 overflow-hidden">
  <div class="services-bg-glow absolute top-0 right-0 w-[600px] h-[600px] pointer-events-none">
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10">
    <div class="max-w-2xl mb-16 lg:mb-20" data-aos="fade-right">
      <div class="badge inline-flex items-center gap-2 px-3 py-1.5 mb-6">
        <span class="badge-dot w-1.5 h-1.5"></span>
        <span class="badge-text">What We Build</span>
      </div>

      <h2 class="section-title mb-6">
        Digital solutions that<br />
        <span class="section-title-highlight">drive business growth.</span>
      </h2>
      <p class="section-subtitle">
        We partner with growing businesses and enterprises to build robust, scalable, and
        beautifully designed software systems.
      </p>
    </div>

    <div class="flex flex-wrap gap-5 lg:gap-6">
      <div *ngFor="let service of services; let i = index" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 100"
        class="service-card relative p-8 lg:p-10 overflow-hidden"
        [ngClass]="service.flexClass">
        <div class="service-card-glow absolute inset-0 pointer-events-none">
        </div>

        <div class="relative z-10 flex flex-col h-full">
          <div class="flex justify-between items-start mb-10">
            <div class="service-icon-wrapper w-14 h-14 flex items-center justify-center">
              <lucide-icon [img]="service.icon" class="w-6 h-6"></lucide-icon>
            </div>

            <div class="service-arrow w-10 h-10 flex items-center justify-center">
              <lucide-icon [img]="ArrowRight" class="w-4 h-4"></lucide-icon>
            </div>
          </div>

          <div class="mt-auto">
            <h3 class="service-title mb-3">
              {{ service.title }}
            </h3>
            <p class="service-description max-w-md">
              {{ service.description }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
