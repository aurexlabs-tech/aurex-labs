<section class="testimonials-section py-14 relative overflow-hidden">
  <div
    class="background-glow absolute top-0 right-0 w-[600px] h-[600px] -translate-y-1/3 translate-x-1/4 pointer-events-none">
  </div>

  <div class="max-w-[1200px] mx-auto px-10 md:px-12 relative z-10">
    <div class="text-center mb-14" data-aos="fade-up">

      <div class="badge inline-flex items-center gap-2 px-3 py-1.5 mb-6">
        <span class="badge-dot w-1.5 h-1.5"></span>
        <span class="badge-text">Client Feedback</span>
      </div>

      <h2 class="section-title">
        What Our
        <span class="section-title-highlight gradient-text">Clients Say</span>
      </h2>
    </div>

    <div class="flex flex-col md:flex-row gap-6 lg:gap-8 items-start justify-center max-w-[860px] mx-auto">
      <div *ngFor="let review of reviews; let i = index" [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 150"
        class="review-card w-full md:w-auto flex-1 relative p-8 lg:p-10" [ngClass]="{ 'lg:mt-12': i === 1 }">
        <div class="star-rating flex gap-1 mb-8">
          <svg *ngFor="let star of [1, 2, 3, 4, 5]" class="star-icon w-4 h-4" viewBox="0 0 20 20">
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        </div>

        <p class="review-quote mb-5">
          "{{ review.quote }}"
        </p>

        <div class="review-author flex items-center gap-4 pt-4">
          <div class="author-avatar flex items-center justify-center w-12 h-12">
            {{ review.initials }}
          </div>

          <div>
            <div class="author-name">{{ review.name }}</div>
            <div class="author-role mt-0.5">
              {{ review.role }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
