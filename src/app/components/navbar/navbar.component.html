<nav class="fixed top-5 inset-x-0 z-50 flex justify-center px-8 pointer-events-none transition-all duration-500"
  [class.top-3]="scrolled">

  <div
    class="navbar-pill pointer-events-auto flex items-center justify-between w-full max-w-[860px] transition-all duration-500"
    [class.navbar-pill--scrolled]="scrolled">

    <!-- Logo -->
    <a routerLink="/" class="navbar-logo group" (click)="closeMobileMenu()">
      <img src="assets/img/A-logo.png" alt="AurexLabs Logo"
        class="w-7 h-7 rounded-lg object-contain bg-white shadow-sm border border-gray-100 p-0.5 group-hover:scale-105 transition-transform duration-300" />
      <span class="navbar-logo__name">AurexLabs</span>
    </a>

    <!-- Desktop divider -->
    <div class="hidden md:block w-px h-4 bg-gray-200/70 mx-1"></div>

    <!-- Desktop Nav Links -->
    <div class="hidden md:flex items-center gap-0.5 px-2">
      <button (click)="scrollToSection('services')" class="nav-link">Services</button>
      <button (click)="scrollToSection('projects')" class="nav-link">Work</button>
      <button (click)="scrollToSection('about')" class="nav-link">About</button>
      <button (click)="scrollToSection('faq')" class="nav-link">FAQ</button>
    </div>

    <!-- Desktop divider -->
    <div class="hidden md:block w-px h-4 bg-gray-200/70 mx-1"></div>

    <!-- Desktop CTA -->
    <div class="hidden md:flex items-center gap-2 pl-2 pr-1">
      <a routerLink="/contact" class="navbar-link-plain">
        Contact
      </a>
      <a routerLink="/contact" class="navbar-cta-btn">
        Start Project
      </a>
    </div>

    <!-- Mobile hamburger -->
    <button
      class="md:hidden relative w-9 h-9 mr-1 flex items-center justify-center rounded-full hover:bg-blue-50 transition-colors"
      (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle navigation menu">
      <div class="flex flex-col gap-[5px] w-4">
        <span class="block h-[1.5px] bg-slate-700 rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(45deg) translateY(3.5px)' : ''">
        </span>
        <span class="block h-[1.5px] bg-slate-700 rounded-full transition-all duration-300"
          [style.opacity]="mobileMenuOpen ? '0' : '1'">
        </span>
        <span class="block h-[1.5px] bg-slate-700 rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(-45deg) translateY(-3.5px)' : ''">
        </span>
      </div>
    </button>
  </div>

  <!-- Mobile Dropdown -->
  <div
    class="absolute top-[68px] inset-x-4 pointer-events-auto md:hidden overflow-hidden transition-all duration-400 ease-in-out origin-top rounded-[1.5rem] shadow-[0_16px_48px_rgba(37,99,235,0.1)]"
    [style.maxHeight]="mobileMenuOpen ? '420px' : '0'" [style.opacity]="mobileMenuOpen ? '1' : '0'"
    [style.transform]="mobileMenuOpen ? 'scaleY(1)' : 'scaleY(0.96)'">
    <div class="p-5 pb-6 bg-white/96 backdrop-blur-2xl border border-white/80 rounded-[1.5rem]">
      <div class="flex flex-col gap-1">
        <button (click)="scrollToSection('services')" class="mobile-nav-link">Services</button>
        <button (click)="scrollToSection('projects')" class="mobile-nav-link">Work</button>
        <button (click)="scrollToSection('about')" class="mobile-nav-link">About</button>
        <button (click)="scrollToSection('faq')" class="mobile-nav-link">FAQ</button>
      </div>
      <div class="mt-5 pt-5 border-t border-gray-100">
        <a routerLink="/contact" (click)="closeMobileMenu()"
          class="flex justify-center items-center w-full px-6 py-3.5 rounded-xl text-[15px] font-bold text-white bg-gradient-to-r from-[#2563EB] to-[#0ea5e9] hover:shadow-[0_8px_24px_rgba(37,99,235,0.35)] transition-all active:scale-95">
          Start a Project
        </a>
      </div>
    </div>
  </div>

</nav>
