<nav
  class="fixed top-6 inset-x-0 z-50 flex justify-center px-4 pointer-events-none transition-all duration-500"
  [class.-translate-y-2]="scrolled"
  [class.scale-[0.98]]="scrolled"
>
  <div
    class="pointer-events-auto flex items-center justify-between backdrop-blur-xl border border-white/60 rounded-full px-2 py-2 w-full max-w-4xl transition-all duration-500"
    [ngClass]="
      scrolled
        ? 'bg-white/95 shadow-[0_16px_40px_rgba(37,99,235,0.08)]'
        : 'bg-gradient-to-r from-white/80 via-[#F5F7FA]/70 to-white/80 shadow-[0_8px_32px_rgba(0,0,0,0.04)]'
    "
  >
    <a href="#" class="flex items-center gap-3 pl-3 pr-5 group" (click)="closeMobileMenu()">
      <img
        src="assets/img/A-logo.png"
        alt="AurexLabs Logo"
        class="w-8 h-8 rounded-lg object-contain bg-white shadow-sm border border-gray-100 p-0.5 group-hover:scale-105 transition-transform duration-300"
      />
      <span class="text-[15px] font-bold tracking-tight text-[#0B0F19]">AurexLabs</span>
    </a>

    <div class="hidden md:block w-px h-5 bg-gray-200/60"></div>

    <div class="hidden md:flex items-center gap-1 px-4">
      <a href="#services" class="nav-link">Services</a>
      <a href="#projects" class="nav-link">Projects</a>
      <a href="#process" class="nav-link">Process</a>
      <a href="#about" class="nav-link">About</a>
    </div>

    <div class="hidden md:block w-px h-5 bg-gray-200/60"></div>

    <div class="hidden md:flex items-center gap-2 pl-4 pr-1">
      <a
        href="#contact"
        class="px-4 py-2 rounded-full text-sm font-medium text-gray-600 hover:text-[#2563EB] hover:bg-blue-50/50 transition-colors"
      >
        Contact
      </a>
      <a
        href="#contact"
        class="px-5 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-[#2563EB] to-[#00D9FF] hover:shadow-lg hover:shadow-blue-500/30 hover:-translate-y-0.5 transition-all duration-300"
      >
        Start Project
      </a>
    </div>

    <button
      class="md:hidden relative w-10 h-10 mr-1 flex items-center justify-center rounded-full hover:bg-blue-50 transition-colors"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <div class="flex flex-col gap-1.5 w-4">
        <span
          class="block h-[2px] bg-[#0B0F19] rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(45deg) translateY(4px)' : ''"
        ></span>
        <span
          class="block h-[2px] bg-[#0B0F19] rounded-full transition-all duration-300"
          [style.opacity]="mobileMenuOpen ? '0' : '1'"
        ></span>
        <span
          class="block h-[2px] bg-[#0B0F19] rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(-45deg) translateY(-4px)' : ''"
        ></span>
      </div>
    </button>
  </div>

  <div
    class="absolute top-20 inset-x-4 pointer-events-auto md:hidden overflow-hidden transition-all duration-500 ease-in-out origin-top rounded-[2rem] shadow-[0_20px_40px_rgba(37,99,235,0.12)]"
    [style.maxHeight]="mobileMenuOpen ? '500px' : '0'"
    [style.opacity]="mobileMenuOpen ? '1' : '0'"
    [style.transform]="mobileMenuOpen ? 'scaleY(1)' : 'scaleY(0.95)'"
  >
    <div class="p-6 pb-8 bg-white/95 backdrop-blur-2xl border border-white/80 rounded-[2rem]">
      <div class="flex flex-col gap-2">
        <a href="#services" class="mobile-nav-link" (click)="closeMobileMenu()">Services</a>
        <a href="#projects" class="mobile-nav-link" (click)="closeMobileMenu()">Projects</a>
        <a href="#process" class="mobile-nav-link" (click)="closeMobileMenu()">Process</a>
        <a href="#about" class="mobile-nav-link" (click)="closeMobileMenu()">About</a>
        <a href="#contact" class="mobile-nav-link" (click)="closeMobileMenu()">Contact</a>
      </div>

      <div class="mt-6 pt-6 border-t border-gray-100">
        <a
          href="#contact"
          (click)="closeMobileMenu()"
          class="flex justify-center items-center w-full px-6 py-4 rounded-2xl text-[15px] font-bold text-white bg-gradient-to-r from-[#2563EB] to-[#00D9FF] hover:shadow-lg hover:shadow-blue-500/25 transition-transform active:scale-95"
        >
          Start a Project
        </a>
      </div>
    </div>
  </div>
</nav>
