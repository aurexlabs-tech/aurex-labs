<nav class="fixed top-6 inset-x-0 z-50 flex justify-center px-4 pointer-events-none transition-all duration-500"
  [class.-translate-y-2]="scrolled" [class.scale-[0.98]]="scrolled">
  <div
    class="bg-white/95 shadow-[0_16px_40px_rgba(37,99,235,0.08)] pointer-events-auto flex items-center justify-between backdrop-blur-xl border border-white/60 rounded-full px-2 py-2 w-full max-w-4xl transition-all duration-500">
    <a routerLink="/" class="flex items-center gap-3 pl-3 pr-5 group" (click)="closeMobileMenu()">
      <img src="assets/img/A-logo.png" alt="AurexLabs Logo"
        class="w-8 h-8 rounded-lg object-contain bg-white shadow-sm border border-gray-100 p-0.5 group-hover:scale-105 transition-transform duration-300" />
      <span class="text-[15px] font-bold tracking-tight text-[#0B0F19]">AurexLabs</span>
    </a>

    <div class="hidden md:block w-px h-5 bg-gray-200/60"></div>

    <div class="hidden md:flex items-center gap-1 px-4">
      <a routerLink="/services" routerLinkActive="!text-brand-blue font-bold" class="nav-link">Services</a>
      <a routerLink="/work" routerLinkActive="!text-brand-blue font-bold" class="nav-link">Work</a>
      <a routerLink="/about" routerLinkActive="!text-brand-blue font-bold" class="nav-link">About</a>
    </div>

    <div class="hidden md:block w-px h-5 bg-gray-200/60"></div>

    <div class="hidden md:flex items-center gap-2 pl-4 pr-1">
      <a routerLink="/contact"
        class="px-4 py-2 rounded-full text-sm font-medium text-gray-600 hover:text-brand-blue hover:bg-blue-50/50 transition-colors">
        Contact
      </a>
      <a routerLink="/contact"
        class="px-5 py-2.5 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-brand-blue to-brand-cyan hover:shadow-glow hover:-translate-y-0.5 transition-all duration-300">
        Start Project
      </a>
    </div>

    <button
      class="md:hidden relative w-10 h-10 mr-1 flex items-center justify-center rounded-full hover:bg-blue-50 transition-colors"
      (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle navigation menu">
      <div class="flex flex-col gap-1.5 w-4">
        <span class="block h-[2px] bg-brand-navy rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(45deg) translateY(4px)' : ''"></span>
        <span class="block h-[2px] bg-brand-navy rounded-full transition-all duration-300"
          [style.opacity]="mobileMenuOpen ? '0' : '1'"></span>
        <span class="block h-[2px] bg-brand-navy rounded-full transition-all duration-300 origin-center"
          [style.transform]="mobileMenuOpen ? 'rotate(-45deg) translateY(-4px)' : ''"></span>
      </div>
    </button>
  </div>

  <div
    class="absolute top-20 inset-x-4 pointer-events-auto md:hidden overflow-hidden transition-all duration-500 ease-in-out origin-top rounded-[2rem] shadow-[0_20px_40px_rgba(37,99,235,0.12)]"
    [style.maxHeight]="mobileMenuOpen ? '500px' : '0'" [style.opacity]="mobileMenuOpen ? '1' : '0'"
    [style.transform]="mobileMenuOpen ? 'scaleY(1)' : 'scaleY(0.95)'">
    <div class="p-6 pb-8 bg-white/95 backdrop-blur-2xl border border-white/80 rounded-[2rem]">
      <div class="flex flex-col gap-2">
        <a routerLink="/services" routerLinkActive="!text-brand-blue !bg-blue-50" class="mobile-nav-link"
          (click)="closeMobileMenu()">Services</a>
        <a routerLink="/work" routerLinkActive="!text-brand-blue !bg-blue-50" class="mobile-nav-link"
          (click)="closeMobileMenu()">Work</a>
        <a routerLink="/about" routerLinkActive="!text-brand-blue !bg-blue-50" class="mobile-nav-link"
          (click)="closeMobileMenu()">About</a>
      </div>

      <div class="mt-6 pt-6 border-t border-gray-100">
        <a routerLink="/contact" (click)="closeMobileMenu()"
          class="flex justify-center items-center w-full px-6 py-4 rounded-2xl text-[15px] font-bold text-white bg-gradient-to-r from-brand-blue to-brand-cyan hover:shadow-glow transition-transform active:scale-95">
          Start a Project
        </a>
      </div>
    </div>
  </div>
</nav>
