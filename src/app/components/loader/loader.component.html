@if (loader.isLoading()) {
  <div class="loader-overlay" role="status" aria-label="Loading">

    <!-- Pulsing concentric rings -->
    <div class="loader-rings">
      <div class="loader-ring loader-ring--1"></div>
      <div class="loader-ring loader-ring--2"></div>
      <div class="loader-ring loader-ring--3"></div>

      <!-- Glowing core -->
      <div class="loader-core"></div>
    </div>

    <!-- Brand text -->
    <p class="loader-text">
      <span class="loader-text__letter" style="--i:0">A</span>
      <span class="loader-text__letter" style="--i:1">u</span>
      <span class="loader-text__letter" style="--i:2">r</span>
      <span class="loader-text__letter" style="--i:3">e</span>
      <span class="loader-text__letter" style="--i:4">x</span>
      <span class="loader-text__letter" style="--i:5">L</span>
      <span class="loader-text__letter" style="--i:6">a</span>
      <span class="loader-text__letter" style="--i:7">b</span>
      <span class="loader-text__letter" style="--i:8">s</span>
    </p>
  </div>
}
