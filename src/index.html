<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>AurexLabs | Engineering Digital Scalability & Intelligence</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO: Meta Description -->
  <meta name="description"
    content="Looking for a professional website or custom web application? AurexLabs builds modern, responsive, and reliable digital solutions that help businesses grow online." />

  <!-- SEO: Robots -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- SEO: Author -->
  <meta name="author" content="AurexLabs" />

  <!-- SEO: Canonical URL -->
  <link rel="canonical" href="https://aurexlabs.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AurexLabs" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="AurexLabs | Professional Website & Web Application Development" />
  <meta property="og:description"
    content="Custom websites and web applications built with modern technologies. Helping businesses create fast, reliable, and user-friendly digital experiences." />
  <meta property="og:url" content="https://aurexlabs.com/" />
  <meta property="og:image" content="https://aurexlabs.com/assets/img/logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AurexLabs – Modern Web Development Agency" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AurexLabs | Professional Website & Web Application Development" />
  <meta name="twitter:description"
    content="Custom websites and web applications built with modern technologies. Helping businesses create fast, reliable, and user-friendly digital experiences." />
  <meta name="twitter:image" content="https://aurexlabs.com/assets/img/logo.png" />
  <meta name="twitter:image:alt" content="AurexLabs – Modern Web Development Agency" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0B0F19" />

  <!-- Mobile: Disable auto-detection of phone numbers -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Favicon: SVG (modern browsers) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Favicon: PNG fallback -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/A-logo.png" />
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/A-logo.png" />

  <!-- Fonts: Preconnect + DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Structured Data: Organization + WebSite (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://aurexlabs.com/#organization",
        "name": "AurexLabs",
        "url": "https://aurexlabs.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://aurexlabs.com/assets/img/logo.png"
        },
        "email": "aurexlabs.tech@gmail.com",
        "description": "AurexLabs builds modern, responsive, and reliable websites and custom web applications that help businesses grow online.",
        "sameAs": []
      },
      {
        "@type": "WebSite",
        "@id": "https://aurexlabs.com/#website",
        "name": "AurexLabs",
        "url": "https://aurexlabs.com",
        "publisher": {
          "@id": "https://aurexlabs.com/#organization"
        },
        "description": "Professional website and web application development services by AurexLabs.",
        "inLanguage": "en-IN"
      }
    ]
  }
  </script>
</head>
